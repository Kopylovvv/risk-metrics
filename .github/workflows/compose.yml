name: Compose

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Container startup, API and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Prepare sources created with a restrictive SSH umask
        run: |
          git ls-files -z | xargs -0 chmod go-rwx
          python scripts/prepare_checkout.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies and Playwright Chromium
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check the complete Compose startup and run E2E browser tests
        run: python scripts/check_compose.py --e2e
