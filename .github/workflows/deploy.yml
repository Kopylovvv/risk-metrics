name: Deploy on vps

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: risk-metrics-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Get github sha
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git show --no-patch "$TARGET_SHA" --format='%H %s'
      - name: prepare ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
      - name: Deploy the tested commit
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh_args=(
            -i "$RUNNER_TEMP/deploy-key"
            -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-known-hosts"
            -o "BatchMode=yes"
            -o "IdentitiesOnly=yes"
            -o "StrictHostKeyChecking=yes"
            teahorses@158.160.170.45
          )
          # Compose exec may read stdin. Finish receiving the script before running it.
          ssh "${ssh_args[@]}" \
            "set -eu; f=\$(mktemp); trap 'rm -f \"\$f\"' EXIT; cat > \"\$f\"; bash \"\$f\" '$TARGET_SHA' </dev/null" \
            < scripts/deploy.sh
          # Verify the release independently of the script's exit status.
          ssh "${ssh_args[@]}" \
            "test \"\$(cat /home/teahorses/risk-metrics/.git/deployed-sha)\" = '$TARGET_SHA' && test \"\$(git -C /home/teahorses/risk-metrics rev-parse HEAD)\" = '$TARGET_SHA' && curl -fsS http://127.0.0.1:8080/health/ready"
      - name: Remove SSH material
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/deploy-known-hosts"
